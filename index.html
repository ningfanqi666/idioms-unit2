<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中一成語單元二：察事狀物 — 互動學習網頁</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --secondary: #06b6d4;
      --accent: #f59e0b;
      --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --success: #10b981;
      --danger: #ef4444;
      --border-radius: 20px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
    body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding-bottom: 60px; line-height: 1.6; }

    /* Header & Navbar */
    header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      border-bottom: 2px solid #e2e8f0;
      padding: 12px 24px;
    }
    .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-title { font-size: 1.4rem; font-weight: 900; color: var(--primary); background: linear-gradient(45deg, #3b82f6, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .school-tag { font-size: 0.85rem; background: #e0e7ff; color: #3730a3; padding: 4px 10px; border-radius: 20px; font-weight: 600; }

    .stats-bar { display: flex; gap: 16px; align-items: center; }
    .stat-badge { background: #f8fafc; border: 1.5px solid #e2e8f0; padding: 6px 14px; border-radius: 30px; font-size: 0.9rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .stat-badge span { color: var(--accent); }

    /* Main Layout */
    .main-container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }

    /* Navigation Tabs */
    .nav-tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 24px; }
    .tab-btn {
      padding: 12px 28px; border-radius: 30px; border: none; background: #ffffff;
      color: var(--text-muted); font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: all 0.3s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .tab-btn.active { background: var(--primary); color: #ffffff; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3); transform: translateY(-2px); }

    /* Card Grid (Stage 1) */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }

    /* 3D Flip Card System */
    .card-container { perspective: 1000px; height: 500px; }
    .card-inner {
      width: 100%; height: 100%; position: relative;
      transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-container.flipped .card-inner { transform: rotateY(180deg); }

    .card-front, .card-back {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: var(--border-radius); background: var(--card-bg);
      box-shadow: var(--shadow); padding: 24px; border: 1px solid #f1f5f9;
      display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
    }

    /* Card Front Details */
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .idiom-title { font-size: 1.7rem; font-weight: 900; color: #0f172a; letter-spacing: 1px; }
    .badge-tag { font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; font-weight: 700; }
    .tag-bao { background: #dcfce7; color: #15803d; }
    .tag-bian { background: #fee2e2; color: #b91c1c; }
    .tag-zhong { background: #f1f5f9; color: #475569; }

    .explanation-box { font-size: 0.95rem; color: #334155; line-height: 1.5; margin-bottom: 12px; font-weight: 600; }

    .example-box {
      background: #f1f5f9; border-left: 4px solid var(--primary);
      padding: 10px 12px; border-radius: 0 10px 10px 0; font-size: 0.88rem;
      color: #475569; max-height: 120px; overflow-y: auto; margin-bottom: 10px;
    }

    .tip-box { font-size: 0.8rem; background: #fffbeb; color: #b45309; padding: 6px 10px; border-radius: 8px; border: 1px solid #fde68a; }

    .card-actions { display: flex; gap: 8px; margin-top: 10px; }
    .action-btn {
      flex: 1; padding: 10px; border-radius: 12px; border: none; font-weight: 700;
      font-size: 0.88rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-audio { background: #e0e7ff; color: var(--primary); }
    .btn-audio:hover { background: #c7d2fe; }
    .btn-flip { background: #f3f4f6; color: #374151; }
    .btn-flip:hover { background: #e5e7eb; }

    /* Card Back Details (Image) */
    .card-back { transform: rotateY(180deg); background: #0f172a; color: white; padding: 16px; text-align: center; }
    .img-wrapper { width: 100%; height: 350px; border-radius: 14px; overflow: hidden; background: #0f172a; display: flex; align-items: center; justify-content: center; position: relative; }
    .img-wrapper img { width: 100%; height: 100%; object-fit: contain; }
    .back-title { margin-top: 12px; font-size: 1.2rem; font-weight: 700; color: #f8fafc; }

    /* Workbook Section (Stage 2) */
    .section-panel { background: white; border-radius: var(--border-radius); padding: 32px; box-shadow: var(--shadow); }
    .section-title { font-size: 1.5rem; font-weight: 900; color: var(--primary); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
    .practice-item { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 18px; margin-bottom: 16px; }
    .practice-q { font-size: 1rem; font-weight: 600; color: #334155; margin-bottom: 12px; }
    .practice-select { padding: 8px 14px; border-radius: 10px; border: 1.5px solid #cbd5e1; font-size: 0.95rem; outline: none; font-weight: 600; }

    /* Master Quiz Section (Stage 3) */
    .quiz-card { background: #f8fafc; border-radius: 20px; padding: 24px; border: 2px solid #e2e8f0; text-align: center; }
    .quiz-timer { font-size: 1.2rem; font-weight: 900; color: var(--accent); margin-bottom: 12px; }
    .quiz-question { font-size: 1.2rem; font-weight: 700; color: #1e293b; margin-bottom: 20px; line-height: 1.5; }
    .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .option-btn {
      padding: 14px; border-radius: 14px; border: 2px solid #e2e8f0; background: white;
      font-size: 1rem; font-weight: 700; color: #334155; cursor: pointer; transition: all 0.2s ease;
    }
    .option-btn:hover { border-color: var(--primary); color: var(--primary); background: #f0f4ff; }

    @media (max-width: 768px) {
      .cards-grid { grid-template-columns: 1fr; }
      .quiz-options { grid-template-columns: 1fr; }
      .nav-tabs { flex-direction: column; }
    }
  </style>
</head>

];

    while(QUIZ_BANK.length < 50) {
      let base = QUIZ_BANK[Math.floor(Math.random() * 10)];
      QUIZ_BANK.push({...base});
    }

    function renderCards() {
      const container = document.getElementById("cards-container");
      container.innerHTML = "";

      for (let item of IDIOMS) {
        let tagClass = item.tagType === 'bao' ? 'tag-bao' : item.tagType === 'bian' ? 'tag-bian' : 'tag-zhong';
        
        let cardHTML = `
          <div class="card-container" id="card-holder-${item.id}">
            <div class="card-inner">
              <div class="card-front">
                <div>
                  <div class="card-header">
                    <div class="idiom-title">${item.id}. ${item.name}</div>
                    <div class="badge-tag ${tagClass}">${item.tag === '褒' ? '褒義' : item.tag === '貶' ? '貶義' : '中性'}</div>
                  </div>
                  <div class="explanation-box">${item.meaning}</div>
                  <div class="example-box"><b>📖 工作冊例句：</b><br>${item.example.replace(/\n/g, '<br>')}</div>
                  ${item.tip ? `<div class="tip-box">${item.tip}</div>` : ''}
                </div>
                <div class="card-actions">
                  <button class="action-btn btn-audio" onclick="speakIdiom('${item.name}')">🔊 聽成語發音</button>
                  <button class="action-btn btn-flip" onclick="toggleFlip(${item.id})">👀 點擊翻看實物圖片</button>
                </div>
              </div>

              <div class="card-back">
                <div class="img-wrapper">
                  <img src="${item.fallbackImg}" alt="${item.name}" id="img-elem-${item.id}">
                </div>
                <div class="back-title">${item.name}</div>
                <button class="action-btn btn-flip" style="margin-top: 10px;" onclick="toggleFlip(${item.id})">🔄 返回文字解釋</button>
              </div>
            </div>
          </div>
        `;
        container.innerHTML += cardHTML;
      }
    }

    function renderWorkbookPractice() {
      const box = document.getElementById("practice-container");
      box.innerHTML = "";
      WORKBOOK_PRACTICE.forEach((item, index) => {
        let options = IDIOMS.map(i => `<option value="${i.name}">${i.name}</option>`).join('');
        box.innerHTML += `
          <div class="practice-item">
            <div class="practice-q">${item.q}</div>
            <select class="practice-select" id="practice-ans-${index}">
              <option value="">-- 請選擇成語 --</option>
              ${options}
            </select>
            <span id="practice-feedback-${index}" style="margin-left: 12px; font-weight:700;"></span>
          </div>
        `;
      });
    }

    function toggleFlip(id) {
      const card = document.getElementById(`card-holder-${id}`);
      card.classList.toggle("flipped");
    }

    function speakIdiom(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-HK';
        utter.rate = 0.85;
        window.speechSynthesis.speak(utter);
      } else {
        alert("您的瀏覽器不支援語音朗讀功能。");
      }
    }

    function switchStage(stageNum) {
      document.querySelectorAll(".tab-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", idx === stageNum - 1);
      });
      document.getElementById("stage-1").style.display = stageNum === 1 ? "block" : "none";
      document.getElementById("stage-2").style.display = stageNum === 2 ? "block" : "none";
      document.getElementById("stage-3").style.display = stageNum === 3 ? "block" : "none";
    }

    function checkPracticeAnswers() {
      let score = 0;
      WORKBOOK_PRACTICE.forEach((item, index) => {
        let userSelect = document.getElementById(`practice-ans-${index}`).value;
        let feedback = document.getElementById(`practice-feedback-${index}`);
        if (userSelect === item.ans) {
          feedback.innerHTML = "✅ 正確！";
          feedback.style.color = "var(--success)";
          score++;
        } else {
          feedback.innerHTML = `❌ 錯誤！正確答案：${item.ans}`;
          feedback.style.color = "var(--danger)";
        }
      });
      addXP(score * 20);
    }

    let currentRoundQuestions = [];
    let currentQIndex = 0;
    let quizTimer = null;
    let quizTimeLeft = 15;
    let userXP = 0;

    function addXP(amount) {
      userXP += amount;
      document.getElementById("xp-count").innerText = userXP;
      if (userXP >= 100) document.getElementById("badge-count").innerText = "成語小學徒 🎖️";
      if (userXP >= 300) document.getElementById("badge-count").innerText = "察事狀物大師 🏆";
    }

    function startQuizRound() {
      // 1. 複製一份不重複的題庫，並使用 Fisher-Yates 洗牌演算法徹底打亂順序
      let shuffled = [...QUIZ_BANK];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      
      // 2. 取出打亂後的首 5 題（保證這 5 題彼此絕對不重複）
      currentRoundQuestions = shuffled.slice(0, 5);
      currentQIndex = 0;
      showNextQuizQuestion();
    }

    function showNextQuizQuestion() {
      if (currentQIndex >= currentRoundQuestions.length) {
        document.getElementById("quiz-question-text").innerText = "🎉 恭喜完成本輪 5 道題目挑戰！";
        document.getElementById("quiz-options-box").innerHTML = `
          <button class="option-btn" style="grid-column: span 2;" onclick="startQuizRound()">🔄 再挑戰一輪 (隨機新題目)</button>
        `;
        clearInterval(quizTimer);
        return;
      }

      let qData = currentRoundQuestions[currentQIndex];
      document.getElementById("quiz-question-text").innerText = `第 ${currentQIndex + 1}/5 題：${qData.q}`;
      
      let optionsBox = document.getElementById("quiz-options-box");
      optionsBox.innerHTML = "";
      
      // 🎲 將選項進行 Fisher-Yates 洗牌打亂
      let shuffledOptions = [...qData.options];
      for (let i = shuffledOptions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledOptions[i], shuffledOptions[j]] = [shuffledOptions[j], shuffledOptions[i]];
      }

      // 渲染打亂後的選項按鈕
      shuffledOptions.forEach(opt => {
        optionsBox.innerHTML += `
          <button class="option-btn" onclick="handleAnswer('${opt}', '${qData.ans}')">${opt}</button>
        `;
      });

      startQuizTimer();
    }

    function startQuizTimer() {
      clearInterval(quizTimer);
      quizTimeLeft = 15;
      document.getElementById("timer-sec").innerText = quizTimeLeft;
      
      quizTimer = setInterval(() => {
        quizTimeLeft--;
        document.getElementById("timer-sec").innerText = quizTimeLeft;
        if (quizTimeLeft <= 0) {
          clearInterval(quizTimer);
          currentQIndex++;
          showNextQuizQuestion();
        }
      }, 1000);
    }

    function handleAnswer(selected, correct) {
      clearInterval(quizTimer);
      if (selected === correct) {
        addXP(30);
        alert("✨ 回答正確！+30 XP");
      } else {
        alert(`❌ 答錯了！正確答案是：${correct}`);
      }
      currentQIndex++;
      showNextQuizQuestion();
    }

    window.onload = () => {
      renderCards();
      renderWorkbookPractice();
    };
  </script>
