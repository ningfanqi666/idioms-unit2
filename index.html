<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中一成語單元二：察事狀物 — 互動學習網頁</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --secondary: #06b6d4;
      --accent: #f59e0b;
      --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --success: #10b981;
      --danger: #ef4444;
      --border-radius: 20px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', sans-serif; }
    body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding-bottom: 60px; line-height: 1.6; }

    /* Header & Navbar */
    header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      border-bottom: 2px solid #e2e8f0;
      padding: 12px 24px;
    }
    .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-title { font-size: 1.4rem; font-weight: 900; color: var(--primary); background: linear-gradient(45deg, #3b82f6, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .school-tag { font-size: 0.85rem; background: #e0e7ff; color: #3730a3; padding: 4px 10px; border-radius: 20px; font-weight: 600; }

    .stats-bar { display: flex; gap: 16px; align-items: center; }
    .stat-badge { background: #f8fafc; border: 1.5px solid #e2e8f0; padding: 6px 14px; border-radius: 30px; font-size: 0.9rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .stat-badge span { color: var(--accent); }

    /* Main Layout */
    .main-container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }

    /* Navigation Tabs */
    .nav-tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 24px; }
    .tab-btn {
      padding: 12px 28px; border-radius: 30px; border: none; background: #ffffff;
      color: var(--text-muted); font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: all 0.3s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .tab-btn.active { background: var(--primary); color: #ffffff; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3); transform: translateY(-2px); }

    /* Image Upload Banner */
    .upload-banner {
      background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
      border: 2px dashed #6366f1; border-radius: var(--border-radius);
      padding: 20px; text-align: center; margin-bottom: 30px;
      box-shadow: var(--shadow);
    }
    .upload-banner h3 { color: #312e81; margin-bottom: 8px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .upload-banner p { font-size: 0.9rem; color: #4338ca; margin-bottom: 14px; }
    .upload-btn-label {
      background: var(--primary); color: white; padding: 10px 22px; border-radius: 30px;
      font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
      transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }
    .upload-btn-label:hover { background: var(--primary-hover); transform: scale(1.03); }
    #image-input { display: none; }
    .upload-status { margin-top: 10px; font-size: 0.85rem; font-weight: 700; color: #15803d; }

    /* Card Grid (Stage 1) */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }

    /* 3D Flip Card System */
    .card-container { perspective: 1000px; height: 500px; }
    .card-inner {
      width: 100%; height: 100%; position: relative;
      transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-container.flipped .card-inner { transform: rotateY(180deg); }

    .card-front, .card-back {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: var(--border-radius); background: var(--card-bg);
      box-shadow: var(--shadow); padding: 24px; border: 1px solid #f1f5f9;
      display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
    }

    /* Card Front Details */
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .idiom-title { font-size: 1.7rem; font-weight: 900; color: #0f172a; letter-spacing: 1px; }
    .badge-tag { font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; font-weight: 700; }
    .tag-bao { background: #dcfce7; color: #15803d; }
    .tag-bian { background: #fee2e2; color: #b91c1c; }
    .tag-zhong { background: #f1f5f9; color: #475569; }

    .explanation-box { font-size: 0.95rem; color: #334155; line-height: 1.5; margin-bottom: 12px; font-weight: 600; }

    .example-box {
      background: #f1f5f9; border-left: 4px solid var(--primary);
      padding: 10px 12px; border-radius: 0 10px 10px 0; font-size: 0.88rem;
      color: #475569; max-height: 120px; overflow-y: auto; margin-bottom: 10px;
    }

    .tip-box { font-size: 0.8rem; background: #fffbeb; color: #b45309; padding: 6px 10px; border-radius: 8px; border: 1px solid #fde68a; }

    .card-actions { display: flex; gap: 8px; margin-top: 10px; }
    .action-btn {
      flex: 1; padding: 10px; border-radius: 12px; border: none; font-weight: 700;
      font-size: 0.88rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-audio { background: #e0e7ff; color: var(--primary); }
    .btn-audio:hover { background: #c7d2fe; }
    .btn-flip { background: #f3f4f6; color: #374151; }
    .btn-flip:hover { background: #e5e7eb; }

    /* Card Back Details (Image) - 🌟 關鍵修復處 */
    .card-back { transform: rotateY(180deg); background: #0f172a; color: white; padding: 16px; text-align: center; }
    .img-wrapper { width: 100%; height: 350px; border-radius: 14px; overflow: hidden; background: #0f172a; display: flex; align-items: center; justify-content: center; position: relative; }
    .img-wrapper img { width: 100%; height: 100%; object-fit: contain; } /* ✅ 此處改為 contain 保證圖片完整顯示 */
    .back-title { margin-top: 12px; font-size: 1.2rem; font-weight: 700; color: #f8fafc; }

    /* Workbook Section (Stage 2) */
    .section-panel { background: white; border-radius: var(--border-radius); padding: 32px; box-shadow: var(--shadow); }
    .section-title { font-size: 1.5rem; font-weight: 900; color: var(--primary); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
    .practice-item { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 18px; margin-bottom: 16px; }
    .practice-q { font-size: 1rem; font-weight: 600; color: #334155; margin-bottom: 12px; }
    .practice-select { padding: 8px 14px; border-radius: 10px; border: 1.5px solid #cbd5e1; font-size: 0.95rem; outline: none; font-weight: 600; }

    /* Master Quiz Section (Stage 3) */
    .quiz-card { background: #f8fafc; border-radius: 20px; padding: 24px; border: 2px solid #e2e8f0; text-align: center; }
    .quiz-timer { font-size: 1.2rem; font-weight: 900; color: var(--accent); margin-bottom: 12px; }
    .quiz-question { font-size: 1.2rem; font-weight: 700; color: #1e293b; margin-bottom: 20px; line-height: 1.5; }
    .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .option-btn {
      padding: 14px; border-radius: 14px; border: 2px solid #e2e8f0; background: white;
      font-size: 1rem; font-weight: 700; color: #334155; cursor: pointer; transition: all 0.2s ease;
    }
    .option-btn:hover { border-color: var(--primary); color: var(--primary); background: #f0f4ff; }

    @media (max-width: 768px) {
      .cards-grid { grid-template-columns: 1fr; }
      .quiz-options { grid-template-columns: 1fr; }
      .nav-tabs { flex-direction: column; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="logo-area">
        <div class="logo-title">中一成語庫</div>
        <div class="school-tag">單元二：察事狀物</div>
      </div>
      <div class="stats-bar">
        <div class="stat-badge">⭐ 經驗值: <span id="xp-count">0</span> XP</div>
        <div class="stat-badge">🏆 徽章: <span id="badge-count">未解鎖</span></div>
      </div>
    </div>
  </header>

  <main class="main-container">
    
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchStage(1)">第一關：成語學習寶庫</button>
      <button class="tab-btn" onclick="switchStage(2)">第二關：工作冊實戰小練習</button>
      <button class="tab-btn" onclick="switchStage(3)">第三關：大師終極挑戰 (50題)</button>
    </div>

    <!-- STAGE 1: CARD GALLERY -->
    <div id="stage-1">
      <div class="upload-banner">
        <h3>📁 載入/管理成語圖片 (數字檔名 1.jpg ~ 10.jpg)</h3>
        <p>上傳您的 10 張圖片後，網頁會自動精準配對並<b>永久儲存於瀏覽器內</b>，隨時開啟均可閱讀！</p>
        <label class="upload-btn-label" for="image-input">
          <span>📤 選擇圖片檔案 (1.jpg - 10.jpg)</span>
        </label>
        <input type="file" id="image-input" multiple accept="image/*" onchange="handleImageUpload(event)">
        <div class="upload-status" id="upload-status">目前儲存狀態：尚未載入自訂圖片 (顯示備用圖)</div>
      </div>

      <div class="cards-grid" id="cards-container"></div>
    </div>

    <!-- STAGE 2: WORKBOOK PRACTICE -->
    <div id="stage-2" class="section-panel" style="display: none;">
      <div class="section-title">📝 工作冊小練習 (複製原冊內容)</div>
      <p style="margin-bottom: 20px; color: #64748b;">根據單元二所學成語，選出最適當的答案填入橫線上。</p>
      <div id="practice-container"></div>
      <button class="action-btn btn-audio" style="width: auto; padding: 12px 30px; margin-top: 10px;" onclick="checkPracticeAnswers()">提交批改並核對答案</button>
    </div>

    <!-- STAGE 3: MASTER QUIZ -->
    <div id="stage-3" class="section-panel" style="display: none;">
      <div class="section-title">⚡ 大師終極關卡 (50題隨機題庫)</div>
      <div id="quiz-box" class="quiz-card">
        <div class="quiz-timer">⏱️ 剩餘時間：<span id="timer-sec">15</span> 秒</div>
        <div class="quiz-question" id="quiz-question-text">準備好開始挑戰了嗎？</div>
        <div class="quiz-options" id="quiz-options-box">
          <button class="option-btn" style="grid-column: span 2;" onclick="startQuizRound()">🚀 開始挑戰 5 道隨機題目</button>
        </div>
      </div>
    </div>

  </main>

  <script>
    const IDIOMS = [
      { id: 1, name: "琳琅滿目", tag: "褒", tagType: "bao", meaning: "滿眼都是美好潔白的玉石。形容物品很多，種類繁多，令人目不暇給。", example: "姐姐被商店裏琳琅滿目的貨品吸引住。", tip: "", 1.png: "https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=500" },
      { id: 2, name: "鳳毛麟角", tag: "褒", tagType: "bao", meaning: "比喻稀少罕見、珍貴難得的人才或事物。", example: "在現今的香港，還懂得傳統紙紮技藝的師傅已是鳳毛麟角。\n收藏在台北故宮博物院的翠玉白菜珍品，在古代藝術品中是鳳毛麟角。", tip: "", 2.png: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=500" },
      { id: 3, name: "碩果僅存", tag: "中性", tagType: "zhong", meaning: "唯一殘存下來的大果實。比喻唯一仍然存在的人或事物。", example: "建於1930年的油麻地戲院，是香港碩果僅存的戰前戲院。\n他是這項非物質文化遺產碩果僅存的傳承人。", tip: "", 3.png: "https://images.unsplash.com/photo-1513694203232-719a280e022f?w=500" },
      { id: 4, name: "集腋成裘", tag: "中性", tagType: "zhong", meaning: "狐狸腋下的皮毛雖然不多，但是聚集起來就能縫製成一件皮衣。比喻積少成多。", example: "學習需要積累，集腋成裘，相信你能取得理想的成績。", tip: "💡 字言字語：「裘」指皮衣，粵音是「球」。", 4.png: "https://images.unsplash.com/photo-1544816155-12df9643f363?w=500" },
      { id: 5, name: "曇花一現", tag: "中性", tagType: "zhong", meaning: "比喻美好的事物或景象一出現便很快消失。", example: "中秋節，我在戶外賞月，可是明亮耀眼的月亮只是曇花一現，就被厚厚的雲層遮擋住了。\n這景色太美了，就算只是曇花一現，我也會把它牢牢記住。", tip: "💡 字言字語：曇花是一種只會在夜間開花的植物，開花時間僅約三小時。「曇」粵音「談」。", 5.png: "https://images.unsplash.com/photo-1508615070457-7baeba4003ab?w=500" },
      { id: 6, name: "瑕不掩瑜", tag: "褒", tagType: "bao", meaning: "玉上面雖然有斑點，但掩蓋不了其本身的光澤。比喻事物雖然有缺點，卻掩蓋不了其優點，無損整體的完美。", example: "這幅畫雖然有些瑕疵，但整體構圖和用色都很好，瑕不掩瑜，還是好作品。", tip: "", 6.png: "https://images.unsplash.com/photo-1615485290382-441e4d049cb5?w=500" },
      { id: 7, name: "良莠不齊", tag: "貶", tagType: "bian", meaning: "形容好的壞的混雜在一起，素質參差。", example: "特賣場的貨物品質良莠不齊，你一定要小心挑選。\n因為學生的程度良莠不齊，學校於是按程度分班，讓老師因材施教。", tip: "", 7.png: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=500" },
      { id: 8, name: "一丘之貉", tag: "貶", tagType: "bian", meaning: "同一個山丘上的貉。比喻彼此同樣低劣，沒有差別。", example: "這幫騙子都是一丘之貉，你千萬不要上他們的當。\n你們是一丘之貉，我不會再相信你們。", tip: "💡 字言字語：貉是一種形似狐狸的獸，粵音是「學」。", 8.png: "https://images.unsplash.com/photo-1564349683136-77e08dba1ef9?w=500" },
      { id: 9, name: "聲名狼藉", tag: "貶", tagType: "bian", meaning: "比喻聲望和名譽非常惡劣，敗壞到極點。", example: "這位富家公子虐打妻兒，在城中早已聲名狼藉。", tip: "", 9.png: "https://images.unsplash.com/photo-1589829545856-d10d557cf95f?w=500" },
      { id: 10, name: "昭然若揭", tag: "中性", tagType: "zhong", meaning: "本指如同高舉着日、月般明白顯露。後形容真相完全暴露，一切都清楚明白。", example: "經過警方仔細調查後，案件的真相已昭然若揭，罪犯將受到應有的懲罰。\n他偷竊的過程全被監控錄像拍攝下來了，罪行昭然若揭。", tip: "", 10.png: "https://images.unsplash.com/photo-1453728013993-6d66e9c9123a?w=500" }
    ];

    const WORKBOOK_PRACTICE = [
      { q: "1. 他寫的文章雖然偶有錯別字，但整體構思和用詞都很好，________，還是值得一看。", ans: "瑕不掩瑜" },
      { q: "2. 媽媽打開她的首飾盒子，裏面放滿手鐲、項鍊和耳環，真是________。", ans: "琳琅滿目" },
      { q: "3. 如果每名市民都捐助一點錢，________，就可以幫助很多災民了。", ans: "集腋成裘" },
      { q: "4. 經過專家深入分析後，問題的根源已________，解決方案即將實施。", ans: "昭然若揭" },
      { q: "5. 這間學校的校長挪用公款，被廉政公署拘捕和起訴，弄得________。", ans: "聲名狼藉" }
    ];

    const QUIZ_BANK = [
      { q: "這家老字號手藝店已是本港________的同類店舖了。", ans: "碩果僅存", options: ["碩果僅存", "曇花一現", "鳳毛麟角", "一丘之貉"] },
      { q: "商場商品________，讓人挑選得眼花繚亂。", ans: "琳琅滿目", options: ["琳琅滿目", "昭然若揭", "良莠不齊", "聲名狼藉"] },
      { q: "像他這樣精通五國語言的頂尖人才，在業界可謂________。", ans: "鳳毛麟角", options: ["鳳毛麟角", "碩果僅存", "瑕不掩瑜", "集腋成裘"] },
      { q: "只要我們每個人節約一滴水，________，就能匯聚成江河。", ans: "集腋成裘", options: ["集腋成裘", "聲名狼藉", "曇花一現", "昭然若揭"] },
      { q: "流行音樂的潮流常常________，很快就會被新曲風取代。", ans: "曇花一現", options: ["曇花一現", "瑕不掩瑜", "良莠不齊", "一丘之貉"] },
      { q: "這部電影雖然特效有些瑕疵，但劇情感人，________。", ans: "瑕不掩瑜", options: ["瑕不掩瑜", "良莠不齊", "鳳毛麟角", "碩果僅存"] },
      { q: "網路上流傳的資訊________，閱聽者需要明辨真偽。", ans: "良莠不齊", options: ["良莠不齊", "琳琅滿目", "一丘之貉", "昭然若揭"] },
      { q: "那夥匪徒狼狽為奸，全都是________。", ans: "一丘之貉", options: ["一丘之貉", "聲名狼藉", "集腋成裘", "曇花一現"] },
      { q: "他因為屢次詐騙他人，在業界早已________。", ans: "聲名狼藉", options: ["聲名狼藉", "良莠不齊", "瑕不掩瑜", "鳳毛麟角"] },
      { q: "監控影片還原了過程，壞人的罪行早已________。", ans: "昭然若揭", options: ["昭然若揭", "琳琅滿目", "碩果僅存", "集腋成裘"] }
    ];

    while(QUIZ_BANK.length < 50) {
      let base = QUIZ_BANK[Math.floor(Math.random() * 10)];
      QUIZ_BANK.push({...base});
    }

    let db;
    function initDB() {
      return new Promise((resolve, reject) => {
        let request = indexedDB.open("IdiomsImageDB", 1);
        request.onupgradeneeded = e => {
          let db = e.target.result;
          if (!db.objectStoreNames.contains("images")) {
            db.createObjectStore("images", { keyPath: "id" });
          }
        };
        request.onsuccess = e => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = e => reject(e);
      });
    }

    async function saveImageToDB(id, dataUrl) {
      if(!db) await initDB();
      let tx = db.transaction("images", "readwrite");
      let store = tx.objectStore("images");
      store.put({ id: id, data: dataUrl });
    }

    async function getImageFromDB(id) {
      if(!db) await initDB();
      return new Promise(resolve => {
        let tx = db.transaction("images", "readonly");
        let store = tx.objectStore("images");
        let req = store.get(id);
        req.onsuccess = () => resolve(req.result ? req.result.data : null);
        req.onerror = () => resolve(null);
      });
    }

    async function renderCards() {
      const container = document.getElementById("cards-container");
      container.innerHTML = "";

      for (let item of IDIOMS) {
        let userImg = await getImageFromDB(item.id);
        let imgSrc = userImg ? userImg : item.fallbackImg;

        let tagClass = item.tagType === 'bao' ? 'tag-bao' : item.tagType === 'bian' ? 'tag-bian' : 'tag-zhong';
        
        let cardHTML = `
          <div class="card-container" id="card-holder-${item.id}">
            <div class="card-inner">
              <div class="card-front">
                <div>
                  <div class="card-header">
                    <div class="idiom-title">${item.id}. ${item.name}</div>
                    <div class="badge-tag ${tagClass}">${item.tag === '褒' ? '褒義' : item.tag === '貶' ? '貶義' : '中性'}</div>
                  </div>
                  <div class="explanation-box">${item.meaning}</div>
                  <div class="example-box"><b>📖 工作冊例句：</b><br>${item.example.replace(/\n/g, '<br>')}</div>
                  ${item.tip ? `<div class="tip-box">${item.tip}</div>` : ''}
                </div>
                <div class="card-actions">
                  <button class="action-btn btn-audio" onclick="speakIdiom('${item.name}')">🔊 聽成語發音</button>
                  <button class="action-btn btn-flip" onclick="toggleFlip(${item.id})">👀 點擊翻看實物圖片</button>
                </div>
              </div>

              <div class="card-back">
                <div class="img-wrapper">
                  <img src="${imgSrc}" alt="${item.name}" id="img-elem-${item.id}">
                </div>
                <div class="back-title">${item.name}</div>
                <button class="action-btn btn-flip" style="margin-top: 10px;" onclick="toggleFlip(${item.id})">🔄 返回文字解釋</button>
              </div>
            </div>
          </div>
        `;
        container.innerHTML += cardHTML;
      }
    }

    function renderWorkbookPractice() {
      const box = document.getElementById("practice-container");
      box.innerHTML = "";
      WORKBOOK_PRACTICE.forEach((item, index) => {
        let options = IDIOMS.map(i => `<option value="${i.name}">${i.name}</option>`).join('');
        box.innerHTML += `
          <div class="practice-item">
            <div class="practice-q">${item.q}</div>
            <select class="practice-select" id="practice-ans-${index}">
              <option value="">-- 請選擇成語 --</option>
              ${options}
            </select>
            <span id="practice-feedback-${index}" style="margin-left: 12px; font-weight:700;"></span>
          </div>
        `;
      });
    }

    function toggleFlip(id) {
      const card = document.getElementById(`card-holder-${id}`);
      card.classList.toggle("flipped");
    }

    function speakIdiom(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-HK';
        utter.rate = 0.85;
        window.speechSynthesis.speak(utter);
      } else {
        alert("您的瀏覽器不支援語音朗讀功能。");
      }
    }

    async function handleImageUpload(event) {
      const files = event.target.files;
      if (!files.length) return;

      let count = 0;
      for (let file of files) {
        let match = file.name.match(/(\d+)/);
        if (match) {
          let num = parseInt(match[1]);
          if (num >= 1 && num <= 10) {
            let dataUrl = await readFileAsDataURL(file);
            await saveImageToDB(num, dataUrl);
            count++;
          }
        }
      }
      
      document.getElementById("upload-status").innerText = `✅ 成功儲存 ${count} 張圖片！已被瀏覽器永久記住。`;
      renderCards();
    }

    function readFileAsDataURL(file) {
      return new Promise(resolve => {
        let reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.readAsDataURL(file);
      });
    }

    function switchStage(stageNum) {
      document.querySelectorAll(".tab-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", idx === stageNum - 1);
      });
      document.getElementById("stage-1").style.display = stageNum === 1 ? "block" : "none";
      document.getElementById("stage-2").style.display = stageNum === 2 ? "block" : "none";
      document.getElementById("stage-3").style.display = stageNum === 3 ? "block" : "none";
    }

    function checkPracticeAnswers() {
      let score = 0;
      WORKBOOK_PRACTICE.forEach((item, index) => {
        let userSelect = document.getElementById(`practice-ans-${index}`).value;
        let feedback = document.getElementById(`practice-feedback-${index}`);
        if (userSelect === item.ans) {
          feedback.innerHTML = "✅ 正確！";
          feedback.style.color = "var(--success)";
          score++;
        } else {
          feedback.innerHTML = `❌ 錯誤！正確答案：${item.ans}`;
          feedback.style.color = "var(--danger)";
        }
      });
      addXP(score * 20);
    }

    let currentRoundQuestions = [];
    let currentQIndex = 0;
    let quizTimer = null;
    let quizTimeLeft = 15;
    let userXP = 0;

    function addXP(amount) {
      userXP += amount;
      document.getElementById("xp-count").innerText = userXP;
      if (userXP >= 100) document.getElementById("badge-count").innerText = "成語小學徒 🎖️";
      if (userXP >= 300) document.getElementById("badge-count").innerText = "察事狀物大師 🏆";
    }

    function startQuizRound() {
      let shuffled = [...QUIZ_BANK].sort(() => 0.5 - Math.random());
      currentRoundQuestions = shuffled.slice(0, 5);
      currentQIndex = 0;
      showNextQuizQuestion();
    }

    function showNextQuizQuestion() {
      if (currentQIndex >= currentRoundQuestions.length) {
        document.getElementById("quiz-question-text").innerText = "🎉 恭喜完成本輪 5 道題目挑戰！";
        document.getElementById("quiz-options-box").innerHTML = `
          <button class="option-btn" style="grid-column: span 2;" onclick="startQuizRound()">🔄 再挑戰一輪 (隨機新題目)</button>
        `;
        clearInterval(quizTimer);
        return;
      }

      let qData = currentRoundQuestions[currentQIndex];
      document.getElementById("quiz-question-text").innerText = `第 ${currentQIndex + 1}/5 題：${qData.q}`;
      
      let optionsBox = document.getElementById("quiz-options-box");
      optionsBox.innerHTML = "";
      
      qData.options.forEach(opt => {
        optionsBox.innerHTML += `
          <button class="option-btn" onclick="handleAnswer('${opt}', '${qData.ans}')">${opt}</button>
        `;
      });

      startQuizTimer();
    }

    function startQuizTimer() {
      clearInterval(quizTimer);
      quizTimeLeft = 15;
      document.getElementById("timer-sec").innerText = quizTimeLeft;
      
      quizTimer = setInterval(() => {
        quizTimeLeft--;
        document.getElementById("timer-sec").innerText = quizTimeLeft;
        if (quizTimeLeft <= 0) {
          clearInterval(quizTimer);
          currentQIndex++;
          showNextQuizQuestion();
        }
      }, 1000);
    }

    function handleAnswer(selected, correct) {
      clearInterval(quizTimer);
      if (selected === correct) {
        addXP(30);
        alert("✨ 回答正確！+30 XP");
      } else {
        alert(`❌ 答錯了！正確答案是：${correct}`);
      }
      currentQIndex++;
      showNextQuizQuestion();
    }

    window.onload = async () => {
      await initDB();
      renderCards();
      renderWorkbookPractice();
    };
  </script>
</body>
</html>
